name: verify

# Mirrors the local serial verification gate exactly (same Gradle tasks and flags,
# same frozen lint/test verifiers). No step may soften a gate: no continue-on-error,
# no lint baseline, no test filtering. Instrumentation (real device) stays out of CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_LINT: app/build/reports/lint-results-debug.xml
      DATA_LINT: data/build/reports/lint-results-debug.xml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK components (compileSdk 34)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # License acceptance is preparation, not a gate; printf exits before sdkmanager reads.
          printf 'y\n%.0s' $(seq 1 20) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Serial verification gate (identical to local)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain \
            clean \
            :domain:risk:check :domain:contracts:check \
            :app:testDebugUnitTest :app:kaptDebugKotlin :app:assembleDebug :app:checkDebugDuplicateClasses \
            :app:assembleDebugAndroidTest \
            :data:lintDebug :app:lintDebug

      - name: Verify unit test XML (floor 544/7/4, skipped 0)
        shell: pwsh
        run: ./.github/scripts/verify-unit-xml.ps1 -EvidenceOut build-evidence/unit-tests.json

      - name: Verify domain lint (risk 0, contracts 1 approved warning)
        shell: pwsh
        run: ./.github/scripts/verify-domain-lint.ps1

      - name: Verify app/data lint exact union (69 / 14)
        shell: pwsh
        run: ./investigations/2026-09-05-integration-m3-permission/verify-integration-lint.ps1 -AppCurrent $env:APP_LINT -DataCurrent $env:DATA_LINT

      - name: Room schema drift (tracked and untracked)
        shell: bash
        run: bash ./.github/scripts/check-schema-drift.sh data/schemas

      - name: Verifier self-check (mutation probes)
        shell: pwsh
        run: ./investigations/2026-09-06-ci-baseline-t1/probe-verifiers.ps1 -Scratch "${{ runner.temp }}/ci-probes" -EvidenceOut build-evidence/verifier-probes.txt

      - name: Lint diff (diagnostic on failure)
        if: failure()
        shell: pwsh
        run: ./.github/scripts/lint-diff.ps1 -AppCurrent $env:APP_LINT -DataCurrent $env:DATA_LINT

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-reports-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-evidence/**
            app/build/reports/lint-results-debug.*
            data/build/reports/lint-results-debug.*
            domain/risk/build/reports/lint-results.*
            domain/contracts/build/reports/lint-results.*
            app/build/test-results/testDebugUnitTest/*.xml
            domain/risk/build/test-results/test/*.xml
            domain/contracts/build/test-results/test/*.xml
